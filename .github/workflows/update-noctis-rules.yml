name: Sync Loyalsoldier Rules to Noctis

on:
  schedule:
    - cron: "0 22 * * *" # 北京时间每天早晨 6:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Noctis rules builder
        run: |
          python scripts/build_noctis_rules.py -o rules_dist

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rules_dist/
          if git diff --staged --quiet; then
            echo "No changes in rules."
          else
            git commit -m "chore: auto-sync Loyalsoldier rules to Noctis profiles [skip ci]"
            git push
          fi
